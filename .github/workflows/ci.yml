name: CI/CD

on:
  push:
    branches: [ main, master, 'feature/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      # --legacy-peer-deps: Required for React 19 compatibility with dependencies that declare
      # React 18 as peer dependency. These dependencies work fine with React 19 but haven't
      # updated their peer dependency declarations yet.
      run: npm ci --legacy-peer-deps

    - name: Type check
      run: npx tsc --noEmit

    - name: Check API spec sync
      run: |
        npm run sync:api-spec
        if git diff --quiet docs/api-spec.yaml; then
          echo "✓ API spec is in sync with upstream"
        else
          echo "✗ API spec is out of sync with upstream"
          echo "Please run 'npm run sync:api-spec' and commit the changes"
          git diff docs/api-spec.yaml
          exit 1
        fi
      env:
        GIT_CONFIG_GLOBAL: /dev/null

    - name: Run tests
      # vitest run — happy-dom, never touches a real browser; the Playwright
      # E2E suite (which does) already runs separately in test.yml's
      # "Playwright E2E + axe" job. This job used to install Playwright
      # browsers here too (a leftover from the pre-Heimdall Storybook/
      # Playwright-interaction-tests era), which bought nothing for this
      # step and, on a slow apt mirror day, could burn the entire 15-minute
      # job timeout just downloading `--with-deps`'s system packages before
      # a single test ran.
      run: npm test
      env:
        GIT_CONFIG_GLOBAL: /dev/null
      timeout-minutes: 10

    - name: Set version from tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        npm version --no-git-tag-version --allow-same-version $VERSION
        echo "Set package version to $VERSION"

    - name: Build
      run: npm run build
      timeout-minutes: 10

    - name: Zip artifact
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        cd dist/embedded
        zip -r ../../dr-viewer-bundle-${{ env.VERSION }}.zip dr-viewer-bundle
        cd ../..

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: dr-viewer-bundle-${{ env.VERSION }}.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
