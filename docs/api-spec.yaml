  /api/changesets/:changesetId:
    get:
      tags:
        - Changesets
      summary: Get changeset
      description: Retrieve a specific changeset with all its changes
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            minLength: 1
            pattern: ^[a-z0-9_-]+$
          required: true
          name: changesetId
          in: path
      responses:
        "200":
          description: Changeset retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  status:
                    type: string
                    enum:
                      - staged
                      - committed
                      - discarded
                  created:
                    type: string
                  modified:
                    type: string
                  baseSnapshot:
                    type: string
                  stats:
                    type: object
                    properties:
                      additions:
                        type: number
                      modifications:
                        type: number
                      deletions:
                        type: number
                    required:
                      - additions
                      - modifications
                      - deletions
                  changes:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                            - add
                            - update
                            - delete
                        elementId:
                          type: string
                        layerName:
                          type: string
                        timestamp:
                          type: string
                        before:
                          description: Previous element state (for update/delete operations)
                        after:
                          description: New element state (for add/update operations)
                        sequenceNumber:
                          type: number
                          description: Assigned once at staging; never renumbered
                        blockers:
                          type: array
                          description: Delete changes only. Relationships in the projected
                            model that still reference the deleted element and are not
                            deleted by this changeset.
                          items:
                            type: object
                            properties:
                              relationshipId:
                                type: string
                              direction:
                                type: string
                                enum:
                                  - in
                                  - out
                              otherElementId:
                                type: string
                              predicate:
                                type: string
                            required:
                              - relationshipId
                              - direction
                              - otherElementId
                              - predicate
                      required:
                        - type
                        - elementId
                        - layerName
                  revision:
                    type: number
                    description: The changeset's nextSequenceNumber (raised by a restage)
                  origin:
                    type: object
                    properties:
                      kind:
                        type: string
                        enum:
                          - chat
                          - plan
                          - extract
                          - cli
                      detail:
                        type: string
                    required:
                      - kind
                  unstaged:
                    type: array
                    description: Tombstones of unstaged (or rewritten) changes
                    items:
                      type: object
                      properties:
                        sequence:
                          type: number
                        removedAt:
                          type: number
                        rewritten:
                          type: boolean
                        change:
                          type: object
                          additionalProperties: true
                      required:
                        - sequence
                        - removedAt
                  review:
                    $ref: "#/components/schemas/ChangesetReview"
                required:
                  - id
                  - name
                  - status
                  - created
                  - modified
                  - stats
                  - changes
        "404":
          description: Changeset not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
  /api/changesets/:changesetId/commit:
    post:
      tags:
        - Changesets
      summary: Commit changeset
      description: "Apply a staged changeset to the model (same as `dr changeset
        commit`): validates it, applies every change atomically, marks it
        committed, and deactivates it if it was active. Refused when the model
        changed since the changeset was created (use the CLI with --force)."
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            minLength: 1
            pattern: ^[a-z0-9_-]+$
          required: true
          name: changesetId
          in: path
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                drop:
                  type: array
                  description: Sequence numbers to leave out. Staged changes that depend on
                    an element added by a dropped add are left out too.
                  items:
                    type: number
                deleteBlockedLinks:
                  type: array
                  description: Delete changes whose blocking relationships are deleted with
                    the element
                  items:
                    type: number
      responses:
        "200":
          description: Action completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                    enum:
                      - staged
                      - committed
                      - discarded
                  committed:
                    type: number
                    description: Changes applied to the model (commit only)
                  skipped:
                    type: number
                    description: Changes skipped as already present (commit only)
                  failed:
                    type: number
                    description: Changes that failed to apply (commit only)
                  dropped:
                    type: array
                    description: Every sequence number left out, including cascaded ones
                    items:
                      type: number
                  linksDeleted:
                    type: number
                    description: Blocking relationships deleted with their elements
                required:
                  - id
                  - name
                  - status
        "404":
          description: Changeset not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
        "409":
          description: Changeset is not staged, or the model drifted since it was created
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
        "422":
          description: The changeset failed validation, or a delete is still in use
            (blockers); nothing was applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                  blockers:
                    type: object
                    description: Per delete sequence number, the relationships that still use it
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          relationshipId:
                            type: string
                          direction:
                            type: string
                          otherElementId:
                            type: string
                          predicate:
                            type: string
                required:
                  - error
  /api/changesets/:changesetId/review:
    put:
      tags:
        - Changesets
      summary: Record review verdicts
      description: "Record per-change verdicts (keep / drop / ask) on a staged changeset.
        A null verdict clears a decision. The server stamps atRevision and decidedAt and
        broadcasts changesets.updated."
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            minLength: 1
            pattern: ^[a-z0-9_-]+$
          required: true
          name: changesetId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decisions:
                  type: array
                  items:
                    type: object
                    properties:
                      sequence:
                        type: number
                      verdict:
                        type: string
                        nullable: true
                        enum:
                          - keep
                          - drop
                          - ask
                      note:
                        type: string
                    required:
                      - sequence
                      - verdict
              required:
                - decisions
      responses:
        "200":
          description: The changeset's review after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangesetReview"
        "404":
          description: Changeset not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "409":
          description: Changeset is not staged
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
        "422":
          description: A decision names a sequence the changeset doesn't have
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
  /api/changesets/:changesetId/discard:
    post:
      tags:
        - Changesets
      summary: Discard changeset
      description:
        "Throw away a staged changeset's changes (same as `dr changeset
        discard`): clears them, marks it discarded, and deactivates it if it was
        active. The model is not touched."
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            minLength: 1
            pattern: ^[a-z0-9_-]+$
          required: true
          name: changesetId
          in: path
      responses:
        "200":
          description: Action completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                    enum:
                      - staged
                      - committed
                      - discarded
                  committed:
                    type: number
                    description: Changes applied to the model (commit only)
                  skipped:
                    type: number
                    description: Changes skipped as already present (commit only)
                  failed:
                    type: number
                    description: Changes that failed to apply (commit only)
                required:
                  - id
                  - name
                  - status
        "404":
          description: Changeset not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
        "409":
          description: Changeset is not staged, or the model drifted since it was created
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
        "422":
          description: The changeset failed validation; nothing was applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message
                required:
                  - error
webhooks: {}
