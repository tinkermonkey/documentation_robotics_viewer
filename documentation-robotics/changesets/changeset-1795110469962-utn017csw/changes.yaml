- type: add
  elementId: application.applicationcomponent.topbar-search
  layerName: application
  after:
    id: 2078f0ab-e262-4220-a853-9c6054878630
    path: application.applicationcomponent.topbar-search
    spec_node_id: application.applicationcomponent
    type: applicationcomponent
    layer_id: application
    name: Topbar Search
    description: "The topbar's search box: an ARIA 1.2 combobox with a listbox popup
      of results grouped by layer (group headers, layer swatch, name, type,
      highlighted match). Arrow keys move the active option
      (aria-activedescendant), Enter chooses, Escape clears then closes,
      Home/End jump. `/` (when not typing in a field) and ⌘K/Ctrl+K focus it. An
      element result calls uiStore.navigateToElement; a node-type result calls
      navigateToSpecNode. Styled from Heimdall's command-palette classes and
      canvas/shell tokens."
    attributes:
      type: internal
    metadata:
      created_at: 2026-11-19T17:48:18.602Z
      updated_at: 2026-11-19T17:48:18.602Z
      version: 1
