id: changeset-1795110469962-utn017csw
name: topbar-search
description: "A type-ahead search in the topbar over the loaded model's elements
  and the spec's node types. Prefix and fuzzy matching with the match
  highlighted. Results are grouped by layer with the layer swatch, name and
  type. Choosing an element navigates as a nav-tree leaf does
  (navigateToElement: history push, centering); choosing a node type opens it in
  the Schema view (navigateToSpecNode). `/` and ⌘K/Ctrl+K focus it. It is an
  ARIA 1.2 combobox (WCAG 2.1 AA). Done when issue #595 is met, tested and
  verified live."
