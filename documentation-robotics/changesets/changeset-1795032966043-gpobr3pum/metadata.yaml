  - sequence: 0
    removedAt: 63
    change:
      type: add
      elementId: application.applicationservice.changeset-drift
      layerName: application
      after:
        id: 5fd8124e-faf2-4a50-ac5e-428a95c7db35
        path: application.applicationservice.changeset-drift
        spec_node_id: application.applicationservice
        type: applicationservice
        layer_id: application
        name: Changeset Drift
        description: "Reads a changeset's base drift from the dr CLI's changeset
          endpoints (drift on GET /api/changesets and /api/changesets/:id):
          state (none, content-free, drifted, not-applicable, unknown),
          blocksCommit and the server's message, and on the detail the overlaps
          and what changed in the base (counts, per-layer, cut lists with
          truncated). Validated from the wire like tier1.ts: malformed values
          are dropped, an older dr CLI's missing drift reads as none known.
          driftTone says whether drift is a problem (blocks a commit), a quiet
          note (content-free), unchecked (unknown) or nothing to show."
        attributes:
          serviceType: synchronous
        metadata:
          created_at: 2026-11-18T20:17:32.126Z
          updated_at: 2026-11-18T20:17:32.126Z
          version: 1
