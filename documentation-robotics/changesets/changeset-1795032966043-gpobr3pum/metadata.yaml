    change:
      type: add
      elementId: application.applicationcomponent.drift-notice
      layerName: application
      after:
        id: 84b29574-1d05-4995-80f1-2fd471364cf1
        path: application.applicationcomponent.drift-notice
        spec_node_id: application.applicationcomponent
        type: applicationcomponent
        layer_id: application
        name: Drift Notice
        description: "How a changeset's base drift reads in the Changesets view: the
          'Base changed since this was staged' badge (inbox card, canvas header,
          inspector) for a plan whose drift blocks a commit, the summary card's
          Apply note (what changed, ask DrBot to restage; the viewer can't land
          it anyway, the commit route takes no force), and the inspector
          overview's drift section (message, the staged changes the base now
          overlaps, per-layer base change counts, a cut list said as cut).
          Content-free drift is a quiet note, unknown says it couldn't be
          checked, a verification record or settled changeset only shows the
          server's message."
        attributes:
          type: internal
        metadata:
          created_at: 2026-11-18T20:17:32.127Z
          updated_at: 2026-11-18T20:17:32.127Z
