- type: add
  elementId: application.applicationservice.changeset-drift
  layerName: application
  after:
    id: 5fd8124e-faf2-4a50-ac5e-428a95c7db35
    path: application.applicationservice.changeset-drift
    spec_node_id: application.applicationservice
    type: applicationservice
    layer_id: application
    name: Changeset Drift
    description: "Reads a changeset's base drift from the dr CLI's changeset
      endpoints (drift on GET /api/changesets and /api/changesets/:id): state
      (none, content-free, drifted, not-applicable, unknown), blocksCommit and
      the server's message, and on the detail the overlaps and what changed in
      the base (counts, per-layer, cut lists with truncated). Validated from the
      wire like tier1.ts: malformed values are dropped, an older dr CLI's
      missing drift reads as none known. driftTone says whether drift is a
      problem to warn about (blocks a commit), a quiet note (content-free),
      unchecked (unknown) or nothing to show."
    attributes:
      serviceType: synchronous
    metadata:
      created_at: 2026-11-18T20:17:32.126Z
      updated_at: 2026-11-18T20:17:32.126Z
      version: 1
    source_reference:
      provenance: extracted
      locations:
        - file: src/apps/embedded/data/changesetDrift.ts
          symbol: src.apps.embedded.data.changesetDrift
  timestamp: 2026-11-18T20:32:30.508Z
  sequenceNumber: 0
- type: add
  elementId: application.applicationcomponent.drift-notice
  layerName: application
  after:
    id: 84b29574-1d05-4995-80f1-2fd471364cf1
    path: application.applicationcomponent.drift-notice
    spec_node_id: application.applicationcomponent
    type: applicationcomponent
    layer_id: application
    name: Drift Notice
    description: "How a changeset's base drift reads in the Changesets view: the
      'Base changed since this was staged' badge (inbox card, canvas header,
      inspector) for a plan whose drift blocks a commit, the summary card's note
      before Apply (the server will likely refuse the commit; ask DrBot to
      restage; the viewer can't land it anyway, the commit route takes no force;
      Apply stays enabled), and the inspector overview's drift section (message,
      the staged changes the base now overlaps, per-layer base change counts, a
      cut list said as cut). Content-free drift is a quiet note, unknown says it
      couldn't be checked, a verification record or settled changeset only shows
      the server's message."
    attributes:
      type: internal
    metadata:
      created_at: 2026-11-18T20:17:32.127Z
      updated_at: 2026-11-18T20:17:32.127Z
      version: 1
    source_reference:
      provenance: extracted
      locations:
        - file: src/apps/embedded/ui/DriftNotice.tsx
          symbol: src.apps.embedded.ui.DriftNotice
  timestamp: 2026-11-18T20:32:30.248Z
