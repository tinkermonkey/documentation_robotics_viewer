    path: application.applicationservice.changeset-purpose
    spec_node_id: application.applicationservice
    type: applicationservice
    layer_id: application
    name: Changeset Purpose
    description: "Reads a changeset's purpose (plan, chat, bootstrap, reconcile,
      verification) and allowed actions (commit, discard) from the dr CLI's
      /api/changesets and /api/changesets/:id, keeping only known values;
      answers whether Apply or Discard is offered (from actions, or a staged
      status on an older dr CLI that sends none); names each purpose and its
      lifecycle; and sorts the inbox by what each changeset needs: plans and
      chat to review, bootstrap/reconcile to land as built, verification records
      paired with the plan they verify, then history."
    attributes:
      serviceType: synchronous
    source_reference:
      provenance: manual
      locations:
        - file: src/apps/embedded/data/changesetPurpose.ts
          symbol: inboxGroups
