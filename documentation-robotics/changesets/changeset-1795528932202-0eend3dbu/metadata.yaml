id: changeset-1795528932202-0eend3dbu
name: remove-pre-heimdall-leftovers
description: >-
  Remove the leftovers of the pre-Heimdall stack (#616) from the model, so it
  matches the cleaned-up repo.


  **In scope**

  - `application.applicationservice.exception-classifier`: its description still
  says "Storybook story error filtering", which nothing does; describe what
  `classifyException` does and fix the source symbol (`classifyException`, not
  `exceptionClassifier`).

  - `technology.systemsoftware.tailwind-css-v4`: Tailwind,
  `@tailwindcss/postcss`, `autoprefixer` and `postcss.config.js` are removed;
  styling is Heimdall's precompiled CSS plus the viewer's own CSS files. Delete
  it.

  - `technology.node.docker-agent-container`,
  `technology.artifact.docker-agent-image` and the base image it named,
  `technology.artifact.switchyard-orchestrator`: `Dockerfile.agent` is deleted
  (nothing builds it; the orchestrator no longer manages this repo). Delete all
  three.


  **Done when** the model names no Storybook, Tailwind or Dockerfile.agent
  element as part of the app, and `changeset_verify` against the branch's
  as-built extraction finds the deletions done.
