name: tier1-panel-warming-mode-routing
description: "Show in the inbox's Tier 1 panel how far the answer-cache fill has
  got while Tier 1 is warming up, whether Tier 1 stages changes without the
  agent or only suggests them, and, for OpenRouter, which upstreams may receive
  card text. Closes #578 and #579."
