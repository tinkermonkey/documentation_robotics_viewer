id: changeset-1795536180200-mrkcqpzdd
name: first-load-loading-states
description: "#636: while a read is pending for the first time, the shell says
  \"Loading…\" instead of presenting empty results as facts. A shared load state
  (`data/loadState.ts`: loading / error / ready from a React Query result; data
  present always reads as ready, so a background refetch never flashes back) and
  one `ui/LoadStatus.tsx` status line (role=\"status\") drive the nav tree (no
  Changesets / layer / Architecture counts, \"Loading…\" in place of \"no
  changesets\"), the canvas (no \"0 elements\" header, \"Loading…\" instead of
  \"no elements in this layer\" and in page mode), the rail footer (`SPEC …`, no
  `0 layers · 0 rels`) and the status bar (`cli …` until /health answers; \"—\"
  still means the server sent none). A failed first read shows an error, never
  \"empty\". Done when component tests cover pending → \"Loading…\" with no 0,
  resolved → real counts, an error, and a refetch that doesn't flash."
