    path: application.applicationservice.load-state
    spec_node_id: application.applicationservice
    type: applicationservice
    layer_id: application
    name: Load State
    description: "`data/loadState.ts`: one read's first-load state as loading /
      error / ready, from a React Query result (`loadStateOf`), and several
      reads combined (`combineLoadStates`: error wins, then loading). Data in
      hand always reads as ready, so a background refetch (model.updated, window
      focus) or a failed refetch never takes a view back to Loading or to an
      error over data it still shows."
    attributes:
      serviceType: synchronous
    metadata:
      created_at: 2026-11-24T16:03:11.559Z
      updated_at: 2026-11-24T16:03:11.559Z
