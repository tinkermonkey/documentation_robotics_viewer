  after:
    id: 3bbe4a82-91ae-4c4e-bf95-1d26d1dfaf3d
    path: ux.statepattern.data-loading-pattern
    spec_node_id: ux.statepattern
    type: statepattern
    layer_id: ux
    name: Data Loading Pattern
    description: "Standard data-loading state pattern used across all views; states:
      idle → loading → loaded/error; with optional retry action on error state.
      Only the FIRST load counts as loading (#636): while a read has no data and
      hasn't failed, a region says \"Loading…\" (role=\"status\") and shows no
      counts; data with zero items shows the empty hint; a failed first read
      shows the error, never \"empty\". A background refetch keeps the data
      shown (no flash back to Loading). Implemented by `data/loadState.ts` and
      `ui/LoadStatus.tsx`."
    attributes: *a1
    source_reference: *a2
    metadata: *a3
  timestamp: 2026-11-24T16:03:16.681Z
