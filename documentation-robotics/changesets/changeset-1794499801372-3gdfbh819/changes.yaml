    type: applicationcomponent
    layer_id: application
    name: Graph Canvas
    description: The primary graph-view component for the Model and Schema views;
      mounts Heimdall's GraphCanvas (@tinkermonkey/heimdall-ui) with a
      user-chosen layout (Clustered force-clustered, Organic default, or
      Orthogonal), keyed by view:layerId:graphLayout:nodeMarginPreset so it
      re-lays out and recenters on any of those changes. Inter-layer (foreign)
      neighbours render as pills with a dashed border and faded swatch, at full
      text contrast, and navigate to their home layer on click. Replaced the old
      React Flow-based GraphViewer + pluggable Dagre/ELK/D3-Force/Graphviz
      layout-engine registry in the June 2026 Heimdall UX rebuild.
