id: changeset-1794490830296-f8gr1hmnd
name: model-sync-heimdall-0.11
description: "Bring the model in line with the code after the Heimdall rebuild
  and heimdall-ui 0.11 (PR #558). Repoints the 17 elements whose code was
  renamed or removed (stores now useXStore hooks, the chat folder,
  EmbeddedLayout/CrossLayerPanel, ACCESSIBILITY.md) at the code that implements
  them now. Adds the UI components (App Shell, Nav Tree, Inspector Drawer, Page
  View, Changesets canvas/impact/inspector, Chat Panel, Annotations), the data
  services behind them (spec graph, page data, layered reach, changeset impact
  analysis, chat context, neighborhood graph), the UI store, the UX views and
  spec, and the 7 API operations docs/api-spec.yaml gained (annotation
  get/replace/replies, get layer, changeset commit/discard). Stamps existing
  operations with their METHOD /path so extraction matches them. Rewires the
  elements the spec 0.12 migration orphaned and removes an APM alert with no
  implementation. Done when every element points at live code and validation
  reports no orphans."
