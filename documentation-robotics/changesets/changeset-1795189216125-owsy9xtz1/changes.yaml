    path: application.applicationservice.chat-panel-layout
    spec_node_id: application.applicationservice
    type: applicationservice
    layer_id: application
    name: Chat Panel Layout
    description: "ui/chatPanelLayout.ts: the pure placement rule for the floating
      DrBot panel. Given the anchor area, whether the Inspector drawer is open
      and its width, and the panel size, it places the panel beside the drawer
      (top-right, left of it), over the drawer (when panel + drawer + 240px of
      graph don't fit, setting chatCoversDrawer) or filling the area (under
      720px). Also clamps the persisted panel size (340-820px wide, at least
      360px tall) and dock width (320-760px), and maps resize keys (arrows,
      Shift, Home/End) to a new width."
    attributes:
      serviceType: synchronous
    source_reference:
      provenance: extracted
      locations:
        - file: src/apps/embedded/ui/chatPanelLayout.ts
          symbol: chatPanelLayout
