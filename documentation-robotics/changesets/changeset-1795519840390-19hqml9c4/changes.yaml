- type: add
  elementId: navigation.route.checkout-shell-route
  layerName: navigation
  after:
    id: f93d2b68-1d01-43d0-9e9f-8263ebc60fcf
    path: navigation.route.checkout-shell-route
    spec_node_id: navigation.route
    type: route
    layer_id: navigation
    name: Checkout Shell Route
    description: "/#/p/:project/c/:checkout/:section/:view: the app shell for one
      checkout of the central process, with the same search params as the
      unscoped shell route had (?layer, ?node, ?edge, ?changeset, ?level,
      ?scope, ?built, ?vp). Its params set the current checkout (checkoutStore)
      that every API call, query key, websocket subscription and DrBot send is
      scoped to. It also takes the CLI's link forms: changesets/<id> (with
      ?element=) and elements/<id> are read as links and replaced with the shell
      URL they open."
    attributes:
      type: protected
    metadata:
      created_at: 2026-11-24T11:32:08.563Z
      updated_at: 2026-11-24T11:32:08.563Z
      version: 1
  timestamp: 2026-11-24T11:32:08.587Z
  sequenceNumber: 2
