    name: Chat Frame Routing
    description: "In chatService: sends project and checkout with chat.send,
      chat.cancel and chat.status; ignores any chat notification whose
      conversation_id or project/checkout is not the current conversation's;
      starts a new conversation when the checkout changes (a conversation
