    name: CLI Deep-Link Transition
    description: "Reads a dr CLI viewer link: changesets/<id> opens the Changesets
      view on that changeset (and with ?element=<id> selects its change to that
      element); elements/<id> waits for the model, resolves the dotted id (or
      UUID) and opens the Model view on that element's layer with it selected;
      an id the model lacks shows the layer with a notice. Replaces the history
      entry, so Back never returns to the raw link."
    attributes:
      from: /p/:project/c/:checkout/changesets/:id |
        /p/:project/c/:checkout/elements/:id
      to: /p/:project/c/:checkout/:section/:view
      trigger: redirect
    metadata:
      created_at: 2026-11-24T11:32:31.378Z
      updated_at: 2026-11-24T11:32:31.378Z
