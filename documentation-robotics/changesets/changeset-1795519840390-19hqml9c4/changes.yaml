    path: ux.view.checkout-picker-view
    spec_node_id: ux.view
    type: view
    layer_id: ux
    name: Checkout Picker View
    description: "The page a bare /#/ (and any old unscoped /#/:section/:view link)
      opens: every project the central process serves, each with its checkouts
      (main checkout first, then worktrees, with branch), from GET /api/projects
      and GET /api/projects/{project}/checkouts. Choosing one opens it (an old
      link's section, view and search carried over). A farm with exactly one
      checkout opens it directly. An older dr CLI without /api/projects gets a
      message saying the viewer needs dr serve."
    attributes:
      type: page
    metadata:
      created_at: 2026-11-24T11:32:08.566Z
      updated_at: 2026-11-24T11:32:08.566Z
      version: 1
  timestamp: 2026-11-24T11:32:08.587Z
