- type: add
  elementId: application.applicationservice.checkout-scope
  layerName: application
  after:
    id: 0abc272c-bee9-4fe1-acd2-28c3e3705c43
    path: application.applicationservice.checkout-scope
    spec_node_id: application.applicationservice
    type: applicationservice
    layer_id: application
    name: Checkout Scope
    description: "data/checkoutScope.ts: the current CheckoutRef ({project,
      checkout}) from checkoutStore as a hook (useCheckoutRef), the scoped query
      keys the data hooks share (the generated client's scoped operation ids,
      then project and checkout), invalidation for one checkout, and whether an
      API error means the checkout is unavailable (404 on a scoped route). Every
      project-data hook (model, layers, tier1, changesets with
      commit/discard/review/verification, annotations) calls the generated
      client's /api/projects/{project}/checkouts/{checkout}/... operations
      through it."
    attributes:
      serviceType: synchronous
    metadata:
      created_at: 2026-11-24T11:32:08.571Z
      updated_at: 2026-11-24T11:32:08.571Z
      version: 1
  timestamp: 2026-11-24T11:32:08.587Z
