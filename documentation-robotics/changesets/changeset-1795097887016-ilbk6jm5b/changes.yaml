    path: application.applicationservice.use-changesets
    spec_node_id: application.applicationservice
    type: applicationservice
    layer_id: application
    name: useChangesets
    description: React Query hooks over GET /api/changesets and /api/changesets/:id
      (with each changeset's purpose, allowed actions and base drift, validated;
      the plan a verification record verifies and, in the detail, what its
      extraction read), Apply (commit) and Discard with their refusal messages,
      including the 409 for a verification record; useLiveChangesetUpdates
      refetches on changesets.updated, which the server also sends after a model
      reload, so drift stays current.
    attributes: *a10
    source_reference: *a11
    metadata: *a12
