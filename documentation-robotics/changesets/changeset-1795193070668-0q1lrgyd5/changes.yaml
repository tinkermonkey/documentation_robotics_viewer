- type: update
  elementId: application.applicationservice.c4-model-transform
  layerName: application
  before:
    id: 28041603-690b-4ffd-a8a4-409b578995e4
    path: application.applicationservice.c4-model-transform
    spec_node_id: application.applicationservice
    type: applicationservice
    layer_id: application
    name: C4 Model Transform
    description: "data/c4/c4Rules.ts + c4Model.ts: a pure transform from the model
      (nodes and resolved links) to a C4 model. Rules are data keyed on spec
      type ids: element rules (type plus an attribute guard to a C4 kind:
      person, external system, container, component), identity merges (a persona
      and the business role it references are one person; same-named actors and
      stakeholders one external system), containment (composes between
      components, a service under the component that realizes it, unowned
      components in the app container), folds (tests, features, schemas and API
      operations attach to the C4 element they cover) and relationship rules
      (keep, flip serves, skip structure, plus path-derived ones such as person
      uses what realizes a feature that serves them). Every C4 element and
      relationship keeps the dotted ids of its sources. Rules that name a type
      or relationship the loaded spec doesn't define are reported, not applied."
    attributes: &a3
      serviceType: synchronous
    metadata: &a4
      created_at: 2026-11-20T15:40:02.898Z
      updated_at: 2026-11-20T15:40:02.898Z
      version: 1
