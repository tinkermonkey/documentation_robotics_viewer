    name: Nav Tree Changeset Groups
    description: "Pure transform for the nav tree: the changeset list split into
      Open (status staged) and Closed (every other status: applied, discarded or
      unknown, as the inbox's History reads it), each keeping the list's order
      (newest first), plus the group key holding a given changeset, so the tree
      can open it."
