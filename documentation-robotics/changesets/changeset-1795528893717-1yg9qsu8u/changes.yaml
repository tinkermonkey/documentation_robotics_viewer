- type: add
  elementId: product.feature.nav-tree-changeset-groups
  layerName: product
  after:
    id: 67887b0c-7e7d-46a8-a687-98754eb53d8f
    path: product.feature.nav-tree-changeset-groups
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Nav Tree Changeset Groups
    description: The left rail's Changesets section groups its rows under Open
      (staged changesets, expanded by default) and Closed (applied and
      discarded, collapsed by default), each with its count in the badge and an
      accessible name like "Open, 3 changesets". An empty group is hidden; the
      "no changesets" hint shows only when both are empty. Opening or closing a
      group pushes no history. The selected changeset's group opens on every
      selection, so a deep link to an applied changeset shows its row. Each row
      keeps its purpose in its title and accessible name.
    attributes:
      priority: medium
      status: planned
      size: s
    metadata:
      created_at: 2026-11-24T14:01:50.616Z
      updated_at: 2026-11-24T14:01:50.616Z
      version: 1
    accepted_gaps:
      - direction: incoming
        predicate: realizes
        other_spec_node_id: ux.view
        reason: The nav tree is shell chrome in the left rail, not a view; the model has
          no UX element for the rail (as for nav-tree-type-groups). The feature
          is realized by the nav-tree component and its grouping service.
        decided_by: agent
        decided_at: 2026-11-24T14:01:55.572Z
        changeset: changeset-1795528893717-1yg9qsu8u
  timestamp: 2026-11-24T14:01:55.574Z
