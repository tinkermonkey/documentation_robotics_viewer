    name: Nav Tree
    description: "Sidebar navigation: an accordion of Architecture / Model / Schema
      / Changesets sections. Architecture lists the C4 levels (Context,
      Containers) and, under Containers, each container with its components
      nested as the C4 model nests them; a row opens that diagram scope. Model,
      Schema and Changesets each have the spec's layers (in the order the spec
      gives). A Model layer opens onto its node types (count, A–Z, collapsed),
      each holding its elements (A–Z); a Schema layer lists its node types;
      Changesets lists the changesets. Opening a type group is local tree state
      and pushes no history. Reveals the current selection, opening its type
      group and scrolling it into view after any navigation, including a deep
      link whose element rows only appear once the model or changesets load."
