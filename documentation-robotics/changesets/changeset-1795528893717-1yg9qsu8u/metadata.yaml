id: changeset-1795528893717-1yg9qsu8u
name: nav-changeset-groups
description: >-
  Group the left rail's Changesets rows under **Open** and **Closed** (#625), so
  staged changesets that still need attention aren't buried among settled ones.


  **In scope**

  - `product.feature.nav-tree-changeset-groups`: Open (staged, expanded by
  default) and Closed (applied / discarded, collapsed by default), each with its
  count badge; accessible names like "Open, 3 changesets"; empty groups hidden,
  the "no changesets" hint only when both are empty; purpose stays in each row's
  title / accessible name.

  - `application.applicationservice.nav-tree-changeset-groups`: pure split of
  the changeset list by status (staged → Open, everything else → Closed, as the
  inbox's History), in `data/navTreeGroups.ts`.

  - `application.applicationcomponent.nav-tree`: group open state local to
  NavTree (never uiStore or the URL, so a toggle pushes no history); the
  selected changeset's group opens on every selection change, so a deep link to
  an applied changeset shows its row.


  **Done when** unit tests cover the split, NavTree component tests cover the
  groups, tsc / test:types / tests / build pass and the rail is checked live.
