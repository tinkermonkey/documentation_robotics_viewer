    path: application.applicationservice.changeset-review-model
    spec_node_id: application.applicationservice
    type: applicationservice
    layer_id: application
    name: Changeset Review Model
    description: "Pure review model over a changeset: review items, groups,
      cancel-out pairs, effective decisions, drop cascade, conflicts,
      since-your-review diff and the apply plan. A link item carries each end's
      name, type, layer and whether this changeset adds it (replacing the 'new
      source' / 'new target' / 'both ends new' chips); an element item counts
      its new links out and in. Apply needs a decision only where one is
      required (#573): canApply holds while a blocked delete is undecided, a
      change waits on DrBot or a drop conflicts, and otherwise undecided changes
      land as kept (apply.undecided lists them); ready still means every change
      has a verdict. The commit body is unchanged: drop names only dropped
      changes, deleteBlockedLinks only kept blocked deletes."
    attributes: *a1
    source_reference: *a2
    metadata: *a3
