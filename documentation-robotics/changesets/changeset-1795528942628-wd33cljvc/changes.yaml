    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: C4 Overlay Change Counts
    description: "With a changeset overlaid on the C4 diagrams, each marked box and
      arrow says how many of the changeset's changes are behind it (\"~ changed
      · 12 changes\", \"+ uses · 4 changes\", none when it is 1), in its chip,
      label, accessible name and the hidden arrow list; the changeset bar states
      the total for the drawn scope (\"37 changes in Web App, each counted
      once\") so a reader can check it against the \"N changes inside\" chip
      they followed. Issue #629."
    attributes:
      priority: medium
      status: planned
      size: s
