- type: update
  elementId: application.applicationcomponent.c4-diagram
  layerName: application
  before:
    id: 45be0003-c860-49b9-b33d-6af1e98954fb
    path: application.applicationcomponent.c4-diagram
    spec_node_id: application.applicationcomponent
    type: applicationcomponent
    layer_id: application
    name: C4 Diagram
    description: "ui/C4Diagram.tsx: draws one laid-out C4 view. Pan and zoom through
      Heimdall's usePanZoom, with its own zoom and fit buttons styled as
      Heimdall's graph toolbar (GraphToolbar itself only works inside a
      GraphCanvas); a dashed boundary rectangle titled with the scope; a card
      per element (name, kind and technology, one line of description; a person
      and a data store get their own shape); right-angle edges with a label of
      the predicates and a count. An overlay's op marks or a comparison's
      verdict marks come from one shared resolution (`ui/c4DiagramMarks.ts`:
      outline, glyph, words, colour token, dash per card and arrow), which the
      export also uses, so an exported diagram carries the same marks. Colours
      from canvas tokens, so it flips with the dark canvas. Keyboard: one Tab
      stop with arrow keys between cards, Enter drills into a card that has
      parts, Escape clears the selection; the arrows, with their status, are
      also listed as text."
    attributes: &a1
      type: internal
    source_reference: &a2
      provenance: extracted
      locations:
        - file: src/apps/embedded/ui/C4Diagram.tsx
