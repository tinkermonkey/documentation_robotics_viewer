id: changeset-1795023145870-qpgmj1e8l
name: fix-websocket-test-links
description: "Move the 10 websocketClient test cases that aren't about auth from
  the WebSocket JSON-RPC channel (security) to the Web Socket Client service
  they test. Point the service at the WebSocketClient class as well as its
  instance, and the security element at the method that does the auth
  (getAuthProtocols), so later extractions don't send the suite to the security
  element again. Done: only the 2 Sec-WebSocket-Protocol tests test the security
  element."
