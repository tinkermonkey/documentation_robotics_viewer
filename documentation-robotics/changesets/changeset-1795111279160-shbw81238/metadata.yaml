id: changeset-1795111279160-shbw81238
name: model-view-by-type
description: "Issue #594. Add a View control to the Model view's page header
  (Graph · Lanes by type · Hive by type) so a DR layer's elements can be seen
  grouped by node type. Lanes: one GraphCanvas layer-lanes lane per node type,
  ordered so linked types sit next to each other, with a \"+N more\" row cap on
  large lanes. Hive: one HivePlot axis per type, disabled under 3 types. Both
  share the selection with the Inspector drawer and get their own viewport key
  scope. A View control, not a Layout value; the mixed graph stays. In the UI
  and code \"layer\" only ever means a DR layer: type groups are type bands
  (data/typeBands.ts, layerBy 'kind'). Done: both views work on every layer, the
  choice persists, tests cover ordering, naming and the accessible names
  (heimdall-ui still says \"layer\" in its own labels: upstream gap, out of
  scope). Design:
  https://github.com/tinkermonkey/documentation_robotics_viewer/issues/594#issu\
  ecomment-7017525918"
