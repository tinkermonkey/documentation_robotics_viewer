id: changeset-1795183413827-cyms3fflj
name: changeset-description-markdown
description: >-
  #588: render a changeset's description as markdown in the canvas header
  (folding a long one) and the inspector, and as a one-paragraph inline excerpt
  on the inbox card, safely (no raw HTML).


  **In scope**

  - `application.applicationcomponent.markdown-text`: gains an inline excerpt
  variant and a folding block variant

  - `application.applicationcomponent.changeset-canvas`: the description under
  the header as markdown, folded behind Show more / Show less when long

  - `application.applicationcomponent.changeset-inbox`: the first paragraph
  only, inline (code spans, emphasis; links as plain text inside the card)

  - `application.applicationcomponent.changeset-inspector`: unchanged; the
  canvas header already shows the description beside it


  **Done when**

  - Lists, code spans, emphasis, links and short headings render in the canvas;
  raw HTML never does and `javascript:` links are stripped

  - The inbox card shows a one-paragraph inline excerpt, never a list or heading

  - A plain-text description from an older dr CLI reads as before
