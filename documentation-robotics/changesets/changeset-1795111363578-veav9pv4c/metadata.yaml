id: changeset-1795111363578-veav9pv4c
name: drbot-floating-panel
description: "Issue #597 (second half). Replace the 372px DrBot sidebar column
  with a floating panel anchored to the topbar DrBot launcher, so opening DrBot
  never reflows the canvas. The panel sits at the graph area's top-right below
  the page header, steps left of an open Inspector DetailDrawer, is resizable
  (left edge and bottom-left corner, 340–820px wide, keyboard on the separator)
  with its size persisted, and is a non-modal dialog: the canvas stays live and
  \"talking to\" follows the selection. Escape from inside closes it and returns
  focus to the launcher. When the panel, the drawer and 240px of graph don't
  fit, the panel takes the drawer's place until it closes; below about 720px it
  fills the graph area. A Dock button turns it into a resizable column
  (320–760px) that collapses to a rail tab. The thread lives in chatStore as
  today. Builds on the default-collapsed half (PR #598). Done: WCAG 2.1 AA
  keyboard path, no collision with the drawer or the graph toolbar, tests for
  placement, Escape/focus return and the narrow rule. Design:
  https://github.com/tinkermonkey/documentation_robotics_viewer/issues/597#issu\
  ecomment-7017526312"
