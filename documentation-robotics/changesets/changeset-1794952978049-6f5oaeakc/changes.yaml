    name: Changeset Impact View
    description: "The Impact tab: every changed element as a reach origin, drawn as
      heimdall-ui layer lanes (gutter-routed skip-layer links, bundled
      same-layer links). Clicking a changed element isolates its reach; clicking
      an element the changeset only reaches shows the changeset's reach through
