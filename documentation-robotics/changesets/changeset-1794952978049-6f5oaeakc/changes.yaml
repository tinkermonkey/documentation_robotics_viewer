    path: application.applicationcomponent.change-inspector
    spec_node_id: application.applicationcomponent
    type: applicationcomponent
    layer_id: application
    name: Change Inspector
    description: "The Changesets inspector column with a change selected. Header: an
      'Adds to <Layer> layer as a <type>' band in the layer's colour, then
      labelled Change / Your decision / Decided by rows. A link change shows the
      Change Link Card. Links in this changeset are grouped Out of / Into the
      element, each row with an arrow, the predicate, the other end's name,
      type, layer and a NEW mark, and a decision only when it isn't Keep. The
      Source reference section always shows, saying none yet when there is
      none."
    attributes:
      type: internal
    source_reference:
      provenance: manual
      locations:
