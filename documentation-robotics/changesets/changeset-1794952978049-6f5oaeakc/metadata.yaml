id: changeset-1794952978049-6f5oaeakc
name: changeset-review-clarity
description: "Make each change in a changeset review legible on its own: label
  the change and your decision as two different things, colour every spec layer
  (Product included), show a link as source → predicate → target, list an
  element's links with direction, type and layer, add a +1-layer neighbourhood
  to the change inspector, and give the Impact tab find, filters and focus. Done
  when a reviewer can judge any change without reading its raw id. Design:
  https://claude.ai/artifact/DC38TetJbk1npbASw4tJXQ"
