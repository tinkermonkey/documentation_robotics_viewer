    name: C4 Changeset Diff
    description: "`data/c4/c4Diff.ts`: `diffC4(base, after, changes)` matches C4
      elements by their source model elements and gives each a status (added,
      removed, changed, moved, parts changed) and each arrow one (added,
      removed, relabelled); `unionC4` draws removed elements and arrows back
      under their nearest surviving ancestor; roll-up counts changes below the
      current level onto the visible ancestor."
    attributes: &a3
      serviceType: synchronous
    metadata: &a4
      created_at: 2026-11-21T01:28:54.103Z
      updated_at: 2026-11-21T01:28:54.103Z
      version: 1
  after:
    id: 736617eb-c972-4d45-9d64-8276e10dbe9f
    path: application.applicationservice.c4-changeset-diff
    spec_node_id: application.applicationservice
    type: applicationservice
    layer_id: application
    name: C4 Changeset Diff
    description: "`data/c4/c4Diff.ts`: `diffC4(base, after, trace)` matches C4
      elements across the two models by the model elements behind them (UUID,
      then dotted id), so a rename reads as changed; it gives each box a status
      (added, removed, moved, changed, parts changed) and each arrow one (added,
      removed, relabelled, or relinked: same label, different model links), with
      the change sequences behind each, roll-ups of changes below a box, and the
      changes no diagram shows (counted, never dropped). Ids are union ids (the
      after id, else a removed element's base id). `unionC4View` is the diagram
      drawn: the after view plus removed boxes and arrows as ghosts."
    attributes: *a3
    metadata: *a4
    source_reference:
      provenance: manual
      locations:
