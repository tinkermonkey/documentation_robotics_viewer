    name: Architecture Canvas
    description: "ui/ArchitectureCanvas.tsx: the Architecture view's canvas. A page
      header with the level control (Context · Containers · Components) and a
      scope breadcrumb, the C4 Changeset Bar when a changeset is overlaid
      (`?changeset=`) or the C4 Plan Comparison Bar when a plan is compared with
      an as-built changeset (`?changeset=` + `?built=`), the C4 Diagram below
      it, and a details drawer for the selected box listing the model elements
      behind it, each a link into the Model view; with an overlay an \"In this
      changeset\" section (each change behind the box with its op, before and
      after, and a link to it in the Changesets view), and with a comparison a
      \"Plan vs as built\" section (each planned element behind the box with its
      verdict, and each unplanned one). Reads the model through useModel and the
      spec through useSpec; level, scope, selection, the overlaid changeset and
      the as-built live in the UI store and the URL. Shows a plain message when
      the model yields no C4 elements, and how many model elements (and overlaid
      changes or verdicts) the rules left out."
