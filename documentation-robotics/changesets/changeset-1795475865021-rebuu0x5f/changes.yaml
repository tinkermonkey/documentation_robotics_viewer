    name: C4 Diagram
    description: "ui/C4Diagram.tsx: draws one laid-out C4 view. Pan and zoom through
      Heimdall's usePanZoom, with its own zoom and fit buttons styled as
      Heimdall's graph toolbar (GraphToolbar itself only works inside a
      GraphCanvas); a dashed boundary rectangle titled with the scope; a card
      per element (name, kind and technology, one line of description; a person
      and a data store get their own shape); right-angle edges with a label of
      the predicates and a count. With a C4 Diff, cards and arrows carry op
      marks in the Impact tab's outline styles (ui/opStyles.ts) plus a text chip
      and the status in their accessible name, never colour alone; removed boxes
      and arrows are drawn as ghosts; a box whose parts changed shows a count.
      With a C4 Plan Comparison, the same slots carry the verdict instead
      (ui/verdictStyles.ts + a chip: ✓ built as planned, ≈ probable, ≠ built
      differently, ∅ planned but not built, ? can't be checked, + built but not
      planned) and a box whose parts carry verdicts shows a count per verdict.
      Colours from canvas tokens, so it flips with the dark canvas. Keyboard:
      one Tab stop with arrow keys between cards, Enter drills into a card that
      has parts (focus follows into the new diagram), Escape clears the
      selection; the arrows, with their status, are also listed as text. Proof
      of concept for boundary rendering, a C4 card and its status slot in
      Heimdall."
