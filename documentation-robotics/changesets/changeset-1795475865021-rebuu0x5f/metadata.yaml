id: changeset-1795475865021-rebuu0x5f
name: c4-diagram-export
description: >-
  Export the C4 diagram on screen as SVG, PNG, Structurizr DSL or PlantUML, so a
  diagram (and its changeset overlay or plan comparison) can be shared outside
  the viewer.


  **In scope**

  - An Export menu in the Architecture view's header: SVG, PNG, Structurizr DSL,
  PlantUML, each a file download named after the diagram (`<level>-<scope>.svg`,
  …).

  - The diagram on screen only: the drawn view's boxes and arrows, its boundary,
  and (with an overlay or a plan comparison) its marks.

  - `data/c4/c4Export.ts` (pure): `toSvg(view, layout, marks)` draws a
  self-contained SVG from the layout (no DOM capture, no external CSS,
  light-canvas colours inlined, fonts named with fallbacks); `toPlantUml(view,
  marks)` writes C4-PlantUML (`!include` of the C4 stdlib, `Person` / `System` /
  `System_Ext` / `Container` / `ContainerDb` / `Component`, `System_Boundary` /
  `Container_Boundary`, `Rel` with the arrow's labels); `toStructurizr(view,
  marks)` writes a Structurizr DSL workspace with the model elements of this
  diagram and one view of the matching kind (`systemContext` / `container` /
  `component`), with `include` of exactly the drawn elements.

  - PNG rasterises the SVG through a canvas at 2x (no new dependency).

  - Overlay and comparison marks: in SVG and PNG drawn as on screen (outline,
  glyph chip); in the text formats as tags (Structurizr) or `$tags` with a
  legend (PlantUML), never dropped.

  - Ids: C4 element ids made into identifiers valid in each format; names and
  descriptions escaped.


  **Done when**

  - Each format downloads from every level with and without an overlay or
  comparison, and is valid: the SVG opens standalone, the PNG is the SVG's
  image, the PlantUML renders with the C4 stdlib, the Structurizr DSL parses.

  - Unit tests for the three writers (escaping, ids, boundaries, marks), a
  component test for the menu, an E2E download test per format, axe on the menu.
