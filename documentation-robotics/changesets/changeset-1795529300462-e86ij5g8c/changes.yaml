    name: Apply shows commit progress
    description: While a changeset commits, the person who pressed Apply sees how
      far it has got (applied of total, and the phase when the server says), or
      at least that it is still working on a dr CLI that reports no progress;
      Apply stays shut until the commit answers. Progress is announced to
      assistive technology now and then, not on every update.
