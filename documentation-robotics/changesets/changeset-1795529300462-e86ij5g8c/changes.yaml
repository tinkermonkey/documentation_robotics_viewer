- type: add
  elementId: application.applicationservice.commit-progress
  layerName: application
  after:
    id: b72dfce1-2724-41dd-b882-1ebcdebd558e
    path: application.applicationservice.commit-progress
    spec_node_id: application.applicationservice
    type: applicationservice
    layer_id: application
    name: Commit Progress
    description: "data/commitProgress.ts: toCommitProgress validates a
      changeset.commit.progress frame; commitProgressReducer keeps the latest
      progress per changeset (never moving applied backwards within a phase);
      useCommitProgress(changesetId) listens on the websocket for the route's
      checkout and returns that changeset's progress, or null when none has
      arrived (an older dr CLI); useAnyCommitProgress returns the progress of
      any commit in the checkout for the status bar. progressAnnouncement picks
      when the polite live region speaks (start, each quarter, phase change,
      finish)."
    attributes:
      serviceType: event-driven
    metadata:
      created_at: 2026-11-24T14:08:44.682Z
      updated_at: 2026-11-24T14:08:44.682Z
      version: 1
  timestamp: 2026-11-24T14:08:44.691Z
