- type: add
  elementId: application.applicationcomponent.commit-progress-bar
  layerName: application
  after:
    id: 4b0e6403-d132-476c-9c9c-3d0dde10b143
    path: application.applicationcomponent.commit-progress-bar
    spec_node_id: application.applicationcomponent
    type: applicationcomponent
    layer_id: application
    name: Commit Progress Bar
    description: 'ui/CommitProgressBar.tsx: a Heimdall ProgressBar for a commit in
      flight. Determinate ("Applying 340 of 1,200 changes · saving",
      role=progressbar with aria-valuenow/max) once the server reports progress;
      indeterminate ("Applying 1,200 changes…", an animated fill, no valuenow,
      still when reduced motion is asked) before the first report or on an older
      dr CLI. A visually hidden polite live region announces at intervals. Used
      by the changeset review summary card while Apply runs, and in compact form
      by the status bar for a commit the CLI or DrBot started.'
    attributes:
      type: internal
    metadata:
      created_at: 2026-11-24T14:08:44.683Z
      updated_at: 2026-11-24T14:08:44.683Z
      version: 1
