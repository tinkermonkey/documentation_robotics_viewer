- type: add
  elementId: data-model.objectschema.commit-progress
  layerName: data-model
  after:
    id: e9144aae-6287-4ee7-aa06-474c503e4c2c
    path: data-model.objectschema.commit-progress
    spec_node_id: data-model.objectschema
    type: objectschema
    layer_id: data-model
    name: Commit Progress
    description: "The dr CLI's changeset.commit.progress WebSocket event
      (documentation_robotics#1361), a plain {type} frame stamped with project
      and checkout: changesetId, applied, total (the changes that will land),
      optional phase (validating, applying, saving, reloading or another the
      server names) and layer. Validated before it reaches React: a frame
      missing a string changesetId or non-negative integer applied/total is
      dropped, applied is clamped to total, an unknown phase is kept as text, a
      non-string layer is dropped."
    attributes:
      type: object
    metadata:
      created_at: 2026-11-24T14:08:49.603Z
      updated_at: 2026-11-24T14:08:49.603Z
      version: 1
