- type: update
  elementId: application.applicationcomponent.changeset-review-panel
  layerName: application
  before:
    id: 52d0e845-92ee-412f-b9f2-8ef0a37cbf85
    path: application.applicationcomponent.changeset-review-panel
    spec_node_id: application.applicationcomponent
    type: applicationcomponent
    layer_id: application
    name: Changeset Review Panel
    description: "A changeset's Review tab: the summary card, the Show / Group by /
      Decided by controls and the per-change rows. Columns are labelled (#,
      Change, Element or link, What it says, Your decision); a change chip
      carries a glyph (+ element, + link, ~ update, − delete) and the decision
      is an outlined pill in its own column; a link row is a chain [source]
      —predicate→ [target] with a dashed end for an element this changeset adds.
      The summary card's Apply is enabled with changes still undecided (it reads
      \"Apply N, M undecided as kept\" and says so under the card); it waits
      only on an undecided blocked delete, an ask or a drop conflict, and Keep
      the other N stays for recording verdicts. Apply and Discard are offered
      only when the server's actions allow them (a verification record gets
      Discard, never Apply); a refused commit of a verification record is
      explained inline. When the server reports drift that blocks a commit, the
      summary card warns before Apply (which stays enabled) and the Apply
      confirm dialog says the drift refusal is the expected outcome; the 409
      after confirm is the result."
    attributes: &a1
      type: internal
    source_reference: &a2
      provenance: manual
      locations:
        - file: src/apps/embedded/ui/ChangesetReviewPanel.tsx
          symbol: ChangesetReviewPanel
