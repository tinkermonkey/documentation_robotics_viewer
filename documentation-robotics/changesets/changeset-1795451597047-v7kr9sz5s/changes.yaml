      (ui/verdictStyles.ts + a chip: ✓ built as planned, ≈ probable, ≠ built
      differently, ∅ planned but not built, ? can't be checked, + built but not
      planned) and a box whose parts carry verdicts shows a count per verdict.
      Colours from canvas tokens, so it flips with the dark canvas. Keyboard:
      one Tab stop with arrow keys between cards, Enter drills into a card that
      has parts (focus follows into the new diagram), Escape clears the
      selection; the arrows, with their status, are also listed as text. Proof
