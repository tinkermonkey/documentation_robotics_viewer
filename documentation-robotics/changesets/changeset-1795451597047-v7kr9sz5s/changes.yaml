    name: Get Changeset Verification
    description: "The per-element result of `changeset_verify` for a plan against an
      as-built changeset: matched, probable, divergent, missing, unverifiable
      and unplanned elements and relationships, with their ids, the extraction
      summary and the counts. Read-only; served by the dr CLI's `dr visualize`
      (documentation_robotics). An older CLI answers 404."
