- type: add
  elementId: motivation.requirement.plan-outcome-reads-as-architecture
  layerName: motivation
  after:
    id: 9e020955-3466-4dc5-b222-7989b4c5c39f
    path: motivation.requirement.plan-outcome-reads-as-architecture
    spec_node_id: motivation.requirement
    type: requirement
    layer_id: motivation
    name: Plan outcome reads as architecture
    description: "A person can see, on the C4 diagrams, whether a plan was built as
      planned: which planned boxes and arrows were built, which were not, and
      what was built that the plan didn't name. The verdicts are the ones the dr
      CLI's plan verification gives, never a second matcher of the viewer's
      own."
    attributes:
      requirementType: functional
      priority: high
    metadata:
      created_at: 2026-11-23T16:33:54.225Z
      updated_at: 2026-11-23T16:33:54.225Z
      version: 1
  timestamp: 2026-11-23T16:33:54.263Z
  sequenceNumber: 0
- type: add
  elementId: product.feature.c4-plan-vs-as-built
  layerName: product
  after:
    id: f2c160ad-188f-4727-a3f6-a154bb885695
    path: product.feature.c4-plan-vs-as-built
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: C4 Plan vs As-Built
    description: "A plan changeset compared with what was built, on the Architecture
      view's C4 diagrams. The diagram is the model as the plan leaves it, with
      the as-built record's unplanned elements laid over it. Each box and arrow
      gets the plan verification's verdict (built as planned, probable, built
      differently, planned but not built, can't be checked, built but not
      planned): a glyph and a line style, never colour alone, rolled up to the
      boxes above it. A verification record pairs with the plan it verifies; any
      as-built or reconcile changeset can be picked by hand."
    attributes:
      priority: high
      status: planned
      size: m
    metadata:
      created_at: 2026-11-23T16:33:54.243Z
      updated_at: 2026-11-23T16:33:54.243Z
      version: 1
  timestamp: 2026-11-23T16:33:54.263Z
  sequenceNumber: 1
