    path: application.applicationservice.c4-plan-comparison
    spec_node_id: application.applicationservice
    type: applicationservice
    layer_id: application
    name: C4 Plan Comparison
    description: "`data/c4/c4PlanCompare.ts`: `compareC4Plan(planAfter, union,
      verification)` lifts the plan verification's verdicts onto the C4 model
      the plan leaves, through `elementOf` / `anchorsOf`, and places the
      as-built's unplanned elements by laying the as-built over that model
      (`overlayModel` + `diffC4`). Each box and arrow gets the worst verdict
      behind it (planned but not built > built differently > probable > can't be
      checked > built as planned; built but not planned on its own), rolled up
      to its ancestors."
    attributes:
