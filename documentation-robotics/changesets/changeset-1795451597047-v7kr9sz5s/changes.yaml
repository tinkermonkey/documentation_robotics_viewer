      Heimdall's graph toolbar (GraphToolbar itself only works inside a
      GraphCanvas); a dashed boundary rectangle titled with the scope; a card
      per element (name, kind and technology, one line of description; a person
      and a data store get their own shape); right-angle edges with a label of
      the predicates and a count. With a C4 Diff, cards and arrows carry op
      marks in the Impact tab's outline styles (ui/opStyles.ts) plus a text chip
      and the status in their accessible name, never colour alone; removed boxes
      and arrows are drawn as ghosts; a box whose parts changed shows a count.
