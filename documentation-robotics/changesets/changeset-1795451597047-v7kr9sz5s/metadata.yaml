id: changeset-1795451597047-v7kr9sz5s
name: c4-plan-vs-as-built
description: >-
  Show a plan changeset against what was built on the C4 diagrams: each box and
  arrow marked built as planned, planned but not built, or built but not
  planned, so the plan's outcome reads at the level of the architecture.


  **In scope**

  - dr CLI: `GET /api/changesets/{planId}/verification?against={asBuiltId}`, the
  per-element result of `changeset_verify` (matched, probable, divergent,
  missing, unverifiable, unplanned). A separate PR in documentation_robotics;
  the viewer says plainly when the server doesn't have it.

  - Pairing: a verification record pairs with the plan it `verifies`; any other
  as-built or reconcile changeset can be picked by hand.

  - `data/c4/c4PlanCompare.ts`: lifts the verdicts onto the C4 model the plan
  leaves (the plan applied), with the as-built's unplanned elements laid over
  it, worst verdict per box and arrow, rolled up to each ancestor.

  - Architecture view: a plan + as-built pair (`?changeset=` + `?built=`), a
  comparison bar with tally and legend, verdict marks on cards and arrows (glyph
  and line style, never colour alone), and the verdicts in the details drawer.


  **Done when**

  - Opening the slice 2 plan `c4-changeset-overlay` against
  `extract-02ab31d..59209a4` shows every planned box marked, the unplanned test
  sketches folded onto what they test, and the tally matching
  `changeset_verify`.

  - An older dr CLI shows a clear "this server can't compare" note, not an
  error.

  - Unit, component and E2E tests (axe in light and dark) cover it.
