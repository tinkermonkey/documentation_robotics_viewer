    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: Nav Tree Type Groups
    description: The left rail's Model tree groups each layer's elements under their
      node type with a count (Layer › Node type (n) › Element). Groups start
      collapsed and sort A–Z by type label, elements A–Z inside; a type with one
      element still gets a group. The selected element's group opens wherever it
      was chosen. Opening a group pushes no history. The Schema tree is
      unchanged.
    attributes:
      priority: medium
      status: planned
      size: s
