id: changeset-1795110463195-az6w0eh20
name: nav-tree-by-type
description: "Issue #592. Group the Model nav tree's elements under their node
  type (Layer › Node type (count) › Element) so big layers scan easily. Groups
  start collapsed; the selected element's group opens whenever it is chosen
  anywhere (nav click, graph click, deep link, cross-layer navigate); a type
  with one element still gets a group; groups and elements sort A–Z; the Schema
  tree is unchanged; opening or closing a group pushes no history (local NavTree
  state, no uiStore/router change). Done when the tree groups by type,
  URL-synced selection, centerOnSelect and reveal-the-selection still work, and
  npm test / test:types / tsc are clean."
