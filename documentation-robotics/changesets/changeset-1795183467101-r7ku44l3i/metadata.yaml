        name: Node Type Label
        description: "data/typeLabel.ts: one display name for a node type, from the
          spec's title (else the type id) and its layer: singular and plural,
          split into words (\"Application Component\"), and a short plural that
          drops the layer's own leading word (\"Components\"). The short form is
          only used where the view is scoped to one layer (nav tree type groups,
          by-type lanes and hive); views that mix layers use the full form.
          withCount gives \"Components · 37\". Type ids stay ids wherever they
          are ids."
