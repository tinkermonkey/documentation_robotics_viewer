- type: add
  elementId: application.applicationcomponent.c4-diagram
  layerName: application
  after:
    id: 45be0003-c860-49b9-b33d-6af1e98954fb
    path: application.applicationcomponent.c4-diagram
    spec_node_id: application.applicationcomponent
    type: applicationcomponent
    layer_id: application
    name: C4 Diagram
    description: "ui/C4Diagram.tsx: draws one laid-out C4 view. Pan and zoom through
      Heimdall's usePanZoom, with its toolbar; a dashed boundary rectangle
      titled with the scope; a card per element (name, kind and technology, one
      line of description; a person and a data store get their own shape);
      right-angle edges with a label of the predicates and a count. Colours from
      canvas tokens, so it flips with the dark canvas. Keyboard: one Tab stop
      with arrow keys between cards, Enter drills into a card that has parts,
      Escape clears the selection. Proof of concept for boundary rendering and a
      C4 card in Heimdall."
    attributes:
      type: internal
    metadata:
      created_at: 2026-11-20T15:40:02.900Z
      updated_at: 2026-11-20T15:40:02.900Z
      version: 1
