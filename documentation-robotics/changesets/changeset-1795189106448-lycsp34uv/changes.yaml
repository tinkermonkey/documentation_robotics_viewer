    path: application.applicationcomponent.architecture-canvas
    spec_node_id: application.applicationcomponent
    type: applicationcomponent
    layer_id: application
    name: Architecture Canvas
    description: "ui/ArchitectureCanvas.tsx: the Architecture view's canvas. A page
      header with the level control (Context · Containers · Components) and a
      scope breadcrumb, the C4 Diagram below it, and a details drawer for the
      selected box listing the model elements behind it, each a link into the
      Model view. Reads the model through useModel and the spec through useSpec;
      level, scope and selection live in the UI store and the URL. Shows a plain
      message when the model yields no C4 elements, and how many model elements
      the rules left out."
    attributes:
      type: internal
