    path: product.feature.c4-architecture-diagrams
    spec_node_id: product.feature
    type: feature
    layer_id: product
    name: C4 Architecture Diagrams
    description: "The model as a C4 diagram set in a top-level Architecture view:
      System Context, Containers and Components, with drill-down into any
      container or component that has parts. People, the system, external
      systems, containers and components are derived from the DR model by rules
      keyed on spec types; a box opens the model elements behind it. Proof of
      concept: base diagrams only, no changeset overlay, Deployment or Dynamic
      diagrams yet."
    attributes:
      priority: high
      status: planned
      size: l
    metadata:
      created_at: 2026-11-20T15:40:02.895Z
      updated_at: 2026-11-20T15:40:02.895Z
