id: changeset-1795189106448-lycsp34uv
name: c4-architecture-views-poc
description: >-
  Add C4 diagrams of the model to the viewer as a proof of concept. A pure
  transform turns the DR model into C4 elements (people, the software system,
  external systems, containers, components) by rules keyed on spec type ids, and
  a new top-level Architecture view draws the Context, Container and Component
  diagrams from it, with drill-down into any component that has parts. The
  nested layout and boundary drawing are POCs meant to move into Heimdall; the
  viewer keeps the transform and the view.


  **In scope**


  - The transform in `data/c4/`: element rules, identity merges (a persona and
  its business role are one person), containment, folds (tests, features and
  schemas attach to a C4 element), and relationships lifted onto C4 elements,
  each keeping its source DR ids.

  - Scoped views: Context, Container, Component at any depth; neighbours outside
  the scope lifted to their nearest visible ancestor.

  - The Architecture view (`#/architecture`): level and scope navigation,
  drill-down, and a selection that opens the source DR element.

  - Layout by ELK (`elkjs`, lazy-loaded), drawn with Heimdall primitives.


  **Not in scope**


  - The changeset overlay on the diagrams (slice 2).

  - Deployment and Dynamic diagrams, and export to Structurizr or Mermaid.

  - Spec or dr CLI changes (ownership and container-membership gaps are separate
  proposals).


  **Done when**


  - On this repo's model the Container diagram shows the two personas, the
  viewer web app, `Browser localStorage` and the DR CLI server, and nothing from
  the technology layer.

  - Component drill-down works from the app container down to `Graph Canvas`.

  - Unit tests cover the rules and the view scoping; the new view passes axe in
  light and dark.
