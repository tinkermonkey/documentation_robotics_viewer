id: changeset-1795532959167-dqn0l9q3r
name: graph-history-replay
description: >-
  Back/Forward replays graph moves (#619), on heimdall-ui 0.14.0.


  **Intent.** The router applies one history policy to graph moves: PUSH on a
  deliberate graph selection (node, edge, lane, C4 box), an Impact focus change,
  a lane/group expand and a centre-on-select recentre onto something the entry
  doesn't already select; REPLACE on a viewport dwell, the mount fit and later
  fits; COALESCE a selection with its own recentre (and a double-click) into one
  entry. The store stays the single owner of "where you are"; the router mirrors
  it.


  **In scope**

  - `application.applicationservice.history-policy`: pure `decideHistoryStep`
  (push / replace / coalesce).

  - `uiStore` records each deliberate move (`graphMove`) in the same write as
  the state it changes; restore actions record none.

  - URL: `?focus=` (Impact focus), `?open=` (opened lanes / groups), `?seq=`
  (reviewed change), `?tab=impact`, `?vp=` for Impact and Architecture, each
  scoped to its view (`liveCanvasKey`).

  - `C4Diagram` reports dwell / navigate and takes `viewportRef` /
  `initialViewport` like GraphCanvas, so `useViewportHistory` drives it.

  - heimdall-ui 0.12.0 → 0.14.0.


  **Done when** Back undoes the last graph move and Forward redoes it, viewport
  included, in Model, Schema, Impact, by-type lanes and Architecture; a copied
  URL reopens the state; panning alone adds no entry.
