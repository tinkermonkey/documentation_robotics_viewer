apm.alert.playwright-test-failure-alert:
  id: bc1b7107-c90f-466c-b28e-63f8eb7c232b
  path: apm.alert.playwright-test-failure-alert
  spec_node_id: apm.alert
  type: alert
  layer_id: apm
  name: Playwright Test Failure Alert
  description: Critical alert triggered when the Playwright E2E test suite exits
    with failures (tests/e2e only — unit/integration/component tests now run
    under Vitest, not Playwright); indicates a regression in the built
    production bundle's shell, views, chat, annotations, or accessibility
    behavior.
  attributes:
    severity: critical
    condition: playwright test exit code not equals 0
  source_reference:
    provenance: inferred
    locations:
      - file: playwright.config.ts
  metadata:
    created_at: 2026-03-20T13:32:13.589Z
    updated_at: 2026-03-20T13:32:13.589Z
    version: 1
