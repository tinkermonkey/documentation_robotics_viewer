  type: flowstep
  layer_id: navigation
  name: Token Extraction Step
  description: "First step of the auth flow: before the router starts (and on
    popstate / hashchange, for a link opened in a tab that already shows the
    viewer), main.tsx takes the magic link's token from the fragment (the dr
    CLI's /#/p/<project>/c/<checkout>/...?token=) or the query string, stores it
    for API and websocket calls and removes it from the address bar."
