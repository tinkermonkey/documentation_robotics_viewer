navigation.route.index-route:
  id: bd3c9cfa-aae2-4f1d-bffd-3d044955518e
  path: navigation.route.index-route
  spec_node_id: navigation.route
  type: route
  layer_id: navigation
  name: Index Route
  description: "Landing route at /#/ (bare, no project): the dr CLI's central
    process serves many projects and checkouts, so it renders the Checkout
    Picker View. A token in the fragment (?token=) is stored and removed from
    the address bar first. When the farm has exactly one checkout it opens that
    checkout's Model view directly."
  attributes:
    type: public
  source_reference:
    provenance: extracted
    locations:
      - file: src/apps/embedded/router.tsx
        symbol: indexRoute
  metadata:
    created_at: 2026-03-20T13:25:26.094Z
    updated_at: 2026-03-20T13:25:26.094Z
    version: 1
navigation.route.app-shell-sectionview-route:
  id: 68cfdda4-3413-4827-98c4-b44fec8346d2
  path: navigation.route.app-shell-sectionview-route
  spec_node_id: navigation.route
  type: route
  layer_id: navigation
  name: App Shell Section/View Route
  description: "The old unscoped route /#/:section/:view (section = model | spec |
    changesets | architecture). Since the viewer runs on the dr CLI's central
    process (dr serve), whose project data is served only per checkout, it no
    longer renders the shell: it opens the Checkout Picker View, which carries
    the section, view and search over to the checkout chosen (or opens the
    farm's only checkout directly)."
  attributes:
    type: redirect
  source_reference:
    provenance: extracted
    locations:
      - file: src/apps/embedded/router.tsx
        symbol: appShellRoute
  metadata:
    created_at: 2026-09-19T15:17:21.969Z
    updated_at: 2026-09-19T15:17:21.969Z
    version: 1
navigation.route.checkout-shell-route:
  id: f93d2b68-1d01-43d0-9e9f-8263ebc60fcf
  path: navigation.route.checkout-shell-route
  spec_node_id: navigation.route
  type: route
  layer_id: navigation
  name: Checkout Shell Route
  description: "/#/p/:project/c/:checkout/:section/:view: the app shell for one
    checkout of the central process, with the same search params as the unscoped
    shell route had (?layer, ?node, ?edge, ?changeset, ?level, ?scope, ?built,
    ?vp). Its params set the current checkout (checkoutStore) that every API
    call, query key, websocket subscription and DrBot send is scoped to. It also
    takes the CLI's link forms: changesets/<id> (with ?element=) and
    elements/<id> are read as links and replaced with the shell URL they open."
  attributes:
    type: protected
  source_reference:
    provenance: manual
    locations:
      - file: src/apps/embedded/router.tsx
        symbol: CheckoutShellRoute
  metadata:
    created_at: 2026-11-24T11:32:08.563Z
    updated_at: 2026-11-24T11:32:08.563Z
    version: 1
