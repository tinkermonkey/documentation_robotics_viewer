navigation.navigationtransition.layer-deep-link-transition:
  id: ff98ecbb-8bc5-4687-bcea-8d208c56496c
  path: navigation.navigationtransition.layer-deep-link-transition
  spec_node_id: navigation.navigationtransition
  type: navigationtransition
  layer_id: navigation
  name: Layer Deep-Link Transition
  description: "Deep links into a layer, element, changeset or C4 diagram: the
    router two-way syncs ?layer= / ?node= / ?edge= / ?changeset= (and ?vp= for
    the graph viewport), and ?level= / ?scope= in the Architecture view, with
    the UI store, so a shared link, reload or back/forward restores the
    selection. A drill-down in the Architecture view pushes a history entry;
    selecting a box replaces it."
  attributes:
    from: model-graph-view
    to: model-graph-view
    trigger: programmatic
  source_reference:
    provenance: inferred
    locations:
      - file: src/apps/embedded/router.tsx
        symbol: AppShellRoute
  metadata:
    created_at: 2026-03-20T13:26:31.679Z
    updated_at: 2026-03-20T13:26:31.679Z
    version: 1
navigation.navigationtransition.cli-deep-link-transition:
  id: dbaccd23-631b-4928-bdfa-e1b3dc437f33
  path: navigation.navigationtransition.cli-deep-link-transition
  spec_node_id: navigation.navigationtransition
  type: navigationtransition
  layer_id: navigation
  name: CLI Deep-Link Transition
  description: "Reads a dr CLI viewer link: changesets/<id> opens the Changesets
    view on that changeset (and with ?element=<id> selects its change to that
    element); elements/<id> waits for the model, resolves the dotted id (or
    UUID) and opens the Model view on that element's layer with it selected; an
    id the model lacks shows the layer with a notice. Replaces the history
    entry, so Back never returns to the raw link."
  attributes:
    from: /p/:project/c/:checkout/changesets/:id |
      /p/:project/c/:checkout/elements/:id
    to: /p/:project/c/:checkout/:section/:view
    trigger: redirect
  source_reference:
    provenance: manual
    locations:
      - file: src/apps/embedded/routes/checkoutLinks.ts
        symbol: readCliLink
  metadata:
    created_at: 2026-11-24T11:32:31.378Z
    updated_at: 2026-11-24T11:32:31.378Z
    version: 1
