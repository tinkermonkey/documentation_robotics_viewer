  spec_node_id: navigation.navigationtransition
  type: navigationtransition
  layer_id: navigation
  name: Tab Navigation Transition
  description: "Switching between the Architecture, Model, Schema and Changesets
    sections in the sidebar nav tree (an accordion: opening a section collapses
    the others). The section is the route's :section segment."
  attributes:
    from: any-route
    to: section-root
    trigger: user-click
  source_reference:
    provenance: extracted
    locations:
      - file: src/apps/embedded/ui/NavTree.tsx
        symbol: NavTree
