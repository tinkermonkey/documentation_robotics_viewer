motivation.requirement.each-review-change-reads-on-its-own:
  id: 76c0c4a0-d4cc-4f6e-8fba-73912268beb3
  path: motivation.requirement.each-review-change-reads-on-its-own
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Each review change reads on its own
  description: "A reviewer can judge any change in a changeset from the review
    list and the change inspector alone: what it does, what they decided, which
    layer it lands in, and how a link's ends connect, without reading its raw
    id."
  attributes:
    requirementType: functional
    priority: high
    documentation: "Verified on a large changeset (mcp-gateway-use-cases, 293
      changes): the change chip and the decision are labelled and shaped
      differently; no chip reuses the word 'source' for anything but a source
      reference; a link shows source → predicate → target with each end's type,
      layer and whether this changeset adds it; an element's links list
      direction, predicate and the other end's type and layer."
  metadata:
    created_at: 2026-11-17T22:03:39.502Z
    updated_at: 2026-11-17T22:03:39.502Z
    version: 1
motivation.requirement.viewer-covers-every-spec-layer:
  id: f8781526-b50a-47a4-9ec1-49b7bf05f9ba
  path: motivation.requirement.viewer-covers-every-spec-layer
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Viewer covers every spec layer
  description: Every layer in the DR spec the server reports has a colour, a label
    and a place in the layer order; nothing falls back to grey, and no count of
    layers is written into the UI.
  attributes:
    requirementType: functional
    priority: high
    documentation: Spec 0.12+ has 13 layers with Product as layer 3; the viewer knew
      12, so Product elements rendered with a grey swatch and the left rail said
      '12 layers'.
  metadata:
    created_at: 2026-11-17T22:03:39.519Z
    updated_at: 2026-11-17T22:03:39.519Z
    version: 1
motivation.requirement.drift-shows-before-apply:
  id: 1fb145fb-601e-4923-9678-7b97da97c40e
  path: motivation.requirement.drift-shows-before-apply
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Drift shows before Apply
  description: A reviewer learns that a changeset's base changed under it before
    reviewing and before confirming Apply, not from the commit's refusal; drift
    that doesn't block (content-free, a verification record, a settled
    changeset) is never shown as a problem.
  attributes:
    requirementType: functional
    priority: high
  metadata:
    created_at: 2026-11-18T20:17:56.261Z
    updated_at: 2026-11-18T20:17:56.261Z
    version: 1
motivation.requirement.only-the-servers-allowed-moves-are-offered:
  id: 283499d0-d88e-4983-bb47-7124e1d39ba6
  path: motivation.requirement.only-the-servers-allowed-moves-are-offered
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Only the server's allowed moves are offered
  description: "The viewer offers Apply and Discard for a changeset only when the
    dr CLI's actions allow them, and treats each changeset by its declared
    purpose: a verification record is never offered as a plan to apply. An older
    dr CLI that sends no purpose or actions keeps today's behaviour."
  attributes:
    requirementType: functional
    priority: high
  metadata:
    created_at: 2026-11-18T19:25:24.476Z
    updated_at: 2026-11-18T19:25:24.476Z
    version: 1
motivation.requirement.find-anything-by-name:
  id: f628ffc2-1cd9-44f4-8441-6b77b37bbfa4
  path: motivation.requirement.find-anything-by-name
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Find anything by name
  description: From any view, a person can reach any model element or spec node
    type by typing part of its name, without knowing its layer or browsing the
    nav tree, using the keyboard alone.
  attributes:
    requirementType: functional
    priority: medium
  metadata:
    created_at: 2026-11-19T17:48:57.905Z
    updated_at: 2026-11-19T17:48:57.905Z
    version: 1
motivation.requirement.dr-bot-opens-without-reflowing-the-canvas:
  id: 2d527d0b-8c90-460f-bc63-6868eefdee07
  path: motivation.requirement.dr-bot-opens-without-reflowing-the-canvas
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: DrBot opens without reflowing the canvas
  description: Opening DrBot must not resize the canvas, wrap the page header or
    cover the Inspector drawer or the graph toolbar while there is room for
    both.
  attributes:
    requirementType: non-functional
    priority: medium
    documentation: "Acceptance: with the Inspector open at 1440px wide, opening
      DrBot leaves the canvas width and the page header unchanged and the panel
      sits left of the drawer; on a window too narrow for both, the panel takes
      the drawer's place until DrBot closes. Source: issue #597."
  accepted_gaps:
    - direction: incoming
      predicate: satisfies
      other_spec_node_id: application.applicationservice
      reason: A layout requirement met by the DrBot panel component and the feature;
        no data service is involved.
      decided_by: agent
      decided_at: 2026-11-19T18:03:19.619Z
      changeset: changeset-1795111363578-veav9pv4c
  metadata:
    created_at: 2026-11-19T18:03:06.730Z
    updated_at: 2026-11-19T18:03:06.730Z
    version: 1
motivation.requirement.architecture-reads-as-c4-diagrams:
  id: ef8acbe2-363e-48b5-b457-b344f315715b
  path: motivation.requirement.architecture-reads-as-c4-diagrams
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Architecture reads as C4 diagrams
  description: A person can read the modelled system as the established C4
    diagrams (Context, Container, Component), derived from the DR model by rule,
    without learning DR's layers or node types. Every box and arrow traces back
    to the model elements it came from, and nothing is drawn that the model
    doesn't hold.
  attributes:
    requirementType: functional
    priority: high
  metadata:
    created_at: 2026-11-20T15:40:02.878Z
    updated_at: 2026-11-20T15:40:02.878Z
    version: 1
motivation.requirement.changesets-read-as-architecture-change:
  id: a5a99a4f-04d4-47b1-bcde-2ba017c89831
  path: motivation.requirement.changesets-read-as-architecture-change
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Changesets read as architecture change
  description: A reviewer can see what a changeset does to the C4 diagrams (boxes
    and arrows added, removed or changed) before Apply, each mark traced to the
    changes behind it.
  attributes:
    requirementType: functional
    priority: high
  metadata:
    created_at: 2026-11-21T01:28:54.086Z
    updated_at: 2026-11-21T01:28:54.086Z
    version: 1
motivation.requirement.plan-outcome-reads-as-architecture:
  id: 9e020955-3466-4dc5-b222-7989b4c5c39f
  path: motivation.requirement.plan-outcome-reads-as-architecture
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Plan outcome reads as architecture
  description: "A person can see, on the C4 diagrams, whether a plan was built as
    planned: which planned boxes and arrows were built, which were not, and what
    was built that the plan didn't name. The verdicts are the ones the dr CLI's
    plan verification gives, never a second matcher of the viewer's own."
  attributes:
    requirementType: functional
    priority: high
  metadata:
    created_at: 2026-11-23T16:33:54.225Z
    updated_at: 2026-11-23T16:33:54.225Z
    version: 1
motivation.requirement.diagrams-travel-outside-the-viewer:
  id: af3e3ac1-1be1-4a45-a3b1-55b8ec0b7d37
  path: motivation.requirement.diagrams-travel-outside-the-viewer
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Diagrams travel outside the viewer
  description: A C4 diagram on screen, with its changeset overlay or plan
    comparison, can be taken out of the viewer as an image (SVG, PNG) or as
    diagram source the C4 tools read (Structurizr DSL, C4-PlantUML), so it can
    go into a document, a review or another tool without a screenshot.
  attributes:
    requirementType: functional
    priority: medium
  metadata:
    created_at: 2026-11-23T23:18:18.911Z
    updated_at: 2026-11-23T23:18:18.911Z
    version: 1
motivation.requirement.open-the-checkout-a-link-names:
  id: 869a6b2b-efc7-4456-a407-71236fde940f
  path: motivation.requirement.open-the-checkout-a-link-names
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Open the Checkout a Link Names
  description: A viewer link from the dr CLI's central process (review_open,
    project_status, dr visualize) of the form
    /#/p/<project>/c/<checkout>/[changesets/<id>[?element=<id>] |
    elements/<id>]?token=<token> opens that project's checkout, and the
    changeset or element it names, never the process's default checkout.
  attributes:
    requirementType: functional
    priority: critical
  metadata:
    created_at: 2026-11-24T11:32:08.549Z
    updated_at: 2026-11-24T11:32:08.549Z
    version: 1
motivation.requirement.keep-checkouts-apart-in-one-browser:
  id: 04024be1-6b1f-423c-afb7-b4e5025fe38a
  path: motivation.requirement.keep-checkouts-apart-in-one-browser
  spec_node_id: motivation.requirement
  type: requirement
  layer_id: motivation
  name: Keep Checkouts Apart in One Browser
  description: "Two tabs on two checkouts of one project never cross: each tab's
    data, websocket events and DrBot chat belong to the checkout it shows."
  attributes:
    requirementType: functional
    priority: high
  metadata:
    created_at: 2026-11-24T11:32:08.563Z
    updated_at: 2026-11-24T11:32:08.563Z
