  name: Graph Canvas
  description: The primary graph-view component for the Model and Schema views;
    mounts Heimdall's GraphCanvas (@tinkermonkey/heimdall-ui) with
    layout="force", keyed by view:layerId so it recenters on layer/view switch.
    Replaced the old React Flow-based GraphViewer + pluggable
    Dagre/ELK/D3-Force/Graphviz layout-engine registry in the June 2026 Heimdall
    UX rebuild — GraphCanvas's force layout is now the only layout mode the app
    renders, and is the exact integration point the sibling heimdall-layout-loop
    harness targets for layout improvements.
