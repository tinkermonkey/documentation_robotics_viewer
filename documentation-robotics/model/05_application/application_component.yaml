  layer_id: application
  name: App Shell
  description: "The viewer's four-pane frame: topbar, sidebar nav tree, the active
    view's canvas (with its inspector), the DrBot chat drawer and the status
    bar. The Architecture view's canvas takes the canvas pane like the Model,
    Schema and Changesets views, with no inspector column. Mounts the live
    model/changeset/annotation refetch hooks."
