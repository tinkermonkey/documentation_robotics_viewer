application.applicationcomponent.graph-canvas:
  id: 7c84e0d3-4126-4ac7-af5d-a30f4708e031
  path: application.applicationcomponent.graph-canvas
  spec_node_id: application.applicationcomponent
  type: applicationcomponent
  layer_id: application
  name: Graph Canvas
  description: The primary graph-view component for the Model and Schema views;
    mounts Heimdall's GraphCanvas (@tinkermonkey/heimdall-ui) with a user-chosen
    layout (Clustered force-clustered, Organic default, or Orthogonal), keyed by
    view:layerId:graphLayout:nodeMarginPreset so it re-lays out and recenters on
    any of those changes. In the Model view a View control beside Layout
    (uiStore.modelView, persisted) swaps the mixed graph for the Type Lanes View
    or Type Hive View; Layout, Boundaries, Node margin and Display apply to the
    mixed graph only. Inter-layer (foreign) neighbours render as pills with a
    dashed border and faded swatch, at full text contrast, and navigate to their
    home layer on click.
  attributes:
    type: internal
  source_reference:
    provenance: extracted
    locations:
      - file: src/apps/embedded/ui/Canvas.tsx
        symbol: Canvas
  metadata:
    created_at: 2026-09-19T15:17:12.908Z
    updated_at: 2026-09-19T15:17:12.908Z
    version: 1
