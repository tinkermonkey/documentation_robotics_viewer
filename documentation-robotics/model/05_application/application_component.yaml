  spec_node_id: application.applicationcomponent
  type: applicationcomponent
  layer_id: application
  name: Change Neighbourhood
  description: "Compact layer lanes in the change inspector: the selected element
    (or both ends of a link) and its reach at the inspector's Follow depth, each
    lane's elements wrapping (a GraphCanvas lanes graph is one row per layer and
    unreadable at inspector width). The focused element is amber, elements this
    changeset adds are dashed, other changed ones carry the Impact op outline,
    elements past the direct links are faded; an element with a change opens it,
    and Open in Impact focuses the same element there."
