application.applicationcomponent.changeset-canvas:
  id: c19e85f7-0b44-41dd-be09-52621bb3d55b
  path: application.applicationcomponent.changeset-canvas
  spec_node_id: application.applicationcomponent
  type: applicationcomponent
  layer_id: application
  name: Changeset Canvas
  description: "The Changesets view's main pane: the header names the changeset's
    purpose and where it came from, a lifecycle line says what this kind of
    changeset is for and what happens next (a verification record leads with the
    plan it verifies and what extraction read; a plan names its verification
    records), then the changeset's description as markdown (a long one folded
    behind Show more, so the change list stays near the top), the op-coded
    change list and a Changes / Impact switch, beside which \"Open in
    Architecture\" shows the changeset on the C4 diagrams, and, on a plan with a
    verification record or on the record itself, \"Compare on the diagrams\"
    opens the plan against it. Its header carries the 'Base changed since this
    was staged' badge when the base drift blocks a commit. A changeset the
    server no longer has (a discard deletes it) shows as gone, with a way back
    to the inbox."
  attributes:
    type: internal
  source_reference:
    provenance: extracted
    locations:
