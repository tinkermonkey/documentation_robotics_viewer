  layer_id: application
  name: C4 View Scoping
  description: "data/c4/c4Views.ts: a pure function from the C4 model, a level
    (context, container, component) and a scope element to one diagram: the
    scope's children, the outside elements they are linked to (each lifted to
    its nearest ancestor that isn't an ancestor of the scope), and the
    relationships between them aggregated per pair with a count, their
    predicates and their source link ids. Technology elements stay out of
    Context, Container and Component views. Also the scope's ancestor chain for
    the breadcrumb, and which elements can be drilled into."
