application.applicationservice.model-graph-transform:
  id: 6bc69ab9-b486-4104-8008-f7ff4ebcd484
  path: application.applicationservice.model-graph-transform
  spec_node_id: application.applicationservice
  type: applicationservice
  layer_id: application
  name: Model Graph Transform
  description: Pure transforms of the /api/model payload into per-layer Heimdall
    GraphCanvas view models (nodes + edges); builds the dual-index (UUID +
    derived dotted id) used to resolve every link endpoint, since links
    reference nodes by either form. Replaced the old
    dataLoader.ts/crossLayerReferenceExtractor.ts/nodeTransformer.ts/yamlParser.ts
    client-side YAML-parsing pipeline — the app now consumes pre-parsed JSON
    from the DR CLI REST API via React Query.
  attributes:
    serviceType: synchronous
  source_reference:
    provenance: extracted
    locations:
      - file: src/apps/embedded/data/modelGraph.ts
        symbol: buildModelIndex
  metadata:
    created_at: 2026-09-19T15:18:09.691Z
    updated_at: 2026-09-19T15:18:09.691Z
    version: 1
