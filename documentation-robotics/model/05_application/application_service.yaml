  path: application.applicationservice.changeset-drift
  spec_node_id: application.applicationservice
  type: applicationservice
  layer_id: application
  name: Changeset Drift
  description: "Reads a changeset's base drift from the dr CLI's changeset
    endpoints (drift on GET /api/changesets and /api/changesets/:id): state
    (none, content-free, drifted, not-applicable, unknown), blocksCommit and the
    server's message, and on the detail the overlaps and what changed in the
    base (counts, per-layer, cut lists with truncated). Validated from the wire
    like tier1.ts: malformed values are dropped, an older dr CLI's missing drift
    reads as none known. driftTone says whether drift is a problem to warn about
    (blocks a commit), a quiet note (content-free), unchecked (unknown) or
    nothing to show."
