application.applicationservice.changeset-review-model:
  id: fc29b9bf-4f62-4236-a64d-6c17a31a5380
  path: application.applicationservice.changeset-review-model
  spec_node_id: application.applicationservice
  type: applicationservice
  layer_id: application
  name: Changeset Review Model
  description: "Pure review model over a changeset: review items, groups,
    cancel-out pairs, effective decisions, drop cascade, conflicts,
    since-your-review diff and the apply plan. A link item carries each end's
    name, type, layer and whether this changeset adds it (replacing the 'new
    source' / 'new target' / 'both ends new' chips); an element item counts its
    new links out and in. Apply needs a decision only where one is required
    (#573): canApply holds while a blocked delete is undecided, a change waits
    on DrBot or a drop conflicts, and otherwise undecided changes land as kept
    (apply.undecided lists them); ready still means every change has a verdict.
    The commit body is unchanged: drop names only dropped changes,
    deleteBlockedLinks only kept blocked deletes."
  attributes:
    serviceType: synchronous
  source_reference:
    provenance: manual
    locations:
      - file: src/apps/embedded/data/changesetReview.ts
        symbol: buildReviewModel
  metadata:
    created_at: 2026-11-17T22:03:59.328Z
    updated_at: 2026-11-17T22:03:59.328Z
    version: 1
