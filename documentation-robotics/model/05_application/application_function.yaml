application.applicationfunction.ui-store:
  id: c95e3e6c-bba2-4761-8b32-fcc6f3f4c1ff
  path: application.applicationfunction.ui-store
  spec_node_id: application.applicationfunction
  type: applicationfunction
  layer_id: application
  name: UI Store
  description: "Zustand store for UI state: view (Model, Schema, Changesets or
    Architecture), layer, selection, changeset, graph/page mode, nav accordion,
    graph settings and canvas tone, plus the Architecture view's C4 level, scope
    element and selected box. A first visit gets a light canvas and DrBot
    closed; preferences persist to localStorage and a persisted choice wins;
    navigation state, the C4 level and scope included, is the router's and is
    not persisted."
  source_reference:
    provenance: extracted
    locations:
      - file: src/apps/embedded/ui/uiStore.ts
        symbol: useUiStore
  metadata:
    created_at: 2026-11-12T13:44:46.094Z
    updated_at: 2026-11-12T13:44:46.094Z
    version: 1
